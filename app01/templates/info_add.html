{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>添加信息</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1/css/bootstrap.css' %}">
</head>
<body>
<div class="container" style="margin-top: 30px;">
    <h2>添加信息</h2>
    <form method="post" action="/info/add/">
        {% csrf_token %}
        <div class="form-group">
            <label>用户名</label>
            <input type="text" class="form-control" name="user" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" class="form-control" name="pwd" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>年龄</label>
            <input type="number" class="form-control" name="age" placeholder="请输入年龄">
        </div>
        <button type="submit" class="btn btn-primary">提交</button>
        <a href="/info/list/" class="btn btn-default">返回</a>
    </form>
</div>

<script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-3.4.1/js/bootstrap.js' %}"></script>
</body>
</html>
